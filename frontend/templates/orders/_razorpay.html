{% comment %}Opens Razorpay Checkout, then posts the result to /payment/verify/ for server-side signature check.{% endcomment %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
(function () {
  const btn = document.getElementById('paybtn');
  const msg = document.getElementById('paymsg');
  let opened = false;      // never stack two payment windows (double tap / Back-Forward)
  let submitted = false;   // never post the same payment twice
  function openPay() {
    if (opened || submitted) return;
    if (typeof Razorpay === 'undefined') {
      btn.disabled = false;
      msg.textContent = 'The payment window could not load. Check your connection and tap the button to try again.';
      return;
    }
    opened = true;
    btn.disabled = true;
    msg.textContent = '';
    const rzp = new Razorpay({
      key: '{{ key_id }}',
      amount: {{ amount_paise }},
      currency: 'INR',
      name: 'E-Homely',
      description: 'Advance for your order',
      order_id: '{{ order.razorpay_order_id }}',
      prefill: { name: "{{ order.name|escapejs }}", contact: "{{ order.phone|escapejs }}" },
      theme: { color: '{{ theme|default:"#58283B" }}' },
      handler: function (r) {
        if (submitted) return;
        submitted = true;
        const f = document.getElementById('verifyform');
        f.razorpay_payment_id.value = r.razorpay_payment_id;
        f.razorpay_order_id.value = r.razorpay_order_id;
        f.razorpay_signature.value = r.razorpay_signature;
        f.submit();
      },
      modal: { ondismiss: function () { opened = false; btn.disabled = false; msg.textContent = 'Payment was not completed. Tap the button to try again.'; } },
    });
    rzp.on('payment.failed', function () { opened = false; btn.disabled = false; msg.textContent = 'Payment failed. Please try again.'; });
    rzp.open();
  }
  btn.addEventListener('click', openPay);
  // Open automatically on a normal visit. If the person got here with the browser's
  // Back/Forward button, do NOT pop the payment window up on its own - let them tap the button.
  let fromHistory = false;
  try {
    const nav = performance.getEntriesByType('navigation')[0];
    fromHistory = !!nav && nav.type === 'back_forward';
  } catch (e) { }
  if (fromHistory) { msg.textContent = 'Tap the button to continue your payment.'; }
  else { setTimeout(openPay, 400); }
})();
</script>
